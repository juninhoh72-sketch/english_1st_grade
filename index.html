.crumbs a:hover{background:#3064a5;transform:translateY(-2px);}

.crumbs .separator{color:#96b5e5;font-size:24px;}

const modes={'School Hunt':{label:'Encontre na escola',icon:'sound'},'Listen and Respond':{label:'Ouça e responda',icon:'sound'},'Listen and Choose':{label:'Ouça e escolha',icon:'sound'},'Matching Cards':{label:'Encontre os pares',icon:'cards'},'Word Unscramble':{label:'Organize a palavra',icon:'letters'}};
const main=document.getElementById('main'),crumbs=document.getElementById('breadcrumbs');
function el(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e;}
function link(text,href,cls){const a=el('a',text,cls);a.href=href;return a;}
function route(y,t){return t?'#bimestre='+t:'#';}
function tile(n,label,url,color){const a=link('',url,'grade g'+color);a.setAttribute('aria-label',n+'º '+(label==='ANO'?'ano':'bimestre'));a.append(el('span',n+'º','num'),el('span',label,'label'));const arrow=el('span','➜','arrow');arrow.setAttribute('aria-hidden','true');a.append(arrow);return a;}
function icon(kind){const e=document.createElementNS('http://www.w3.org/2000/svg','svg');e.setAttribute('viewBox','0 0 24 24');e.setAttribute('fill','none');e.setAttribute('stroke','currentColor');e.setAttribute('stroke-width','1.8');e.setAttribute('stroke-linecap','round');e.setAttribute('stroke-linejoin','round');e.setAttribute('aria-hidden','true');const paths={sound:'M3 9v6h4l5 4V5L7 9H3 M16 8a6 6 0 0 1 0 8 M19 5a10 10 0 0 1 0 14',cards:'M9 3h12v15H9z M5 7H3v14h13v-1',letters:'M3 18L8 5l5 13 M5 13h6 M15 16l3 3 4-6'};const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',paths[kind]||paths.sound);e.append(p);return e;}
function remember(a,y,t){a.addEventListener('click',()=>{try{sessionStorage.setItem('english-1ano-return',route(y,t));}catch{}});}
const searchInput=document.getElementById('gameSearch'),clearSearch=document.getElementById('clearSearch'),searchStatus=document.getElementById('searchStatus');
function normalize(text){return String(text||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function searchGames(query){const terms=normalize(query).split(' ').filter(Boolean);return games.filter(g=>{const theme={"I AM A STUDENT!":"escola professor professora estudantes aluno aluna menino menina school teacher students boy girl","HI, THERE!":"cumprimentos saudacoes saudações apresentacao apresentação oi ola olá tchau hello hi goodbye nome name","FOOD!":'comida comidas alimento alimentos bebida bebidas',"FREE TIME ACTIVITIES":'lazer tempo livre atividades',"SHAPES":'forma formas geometria geometricas'}[g.title]||'';const type={'Matching Cards':'pares pareamento memoria','Listen and Choose':'ouvir ouca escutar escolha escolher audio','Word Unscramble':'organizar organize montar letras palavras embaralhadas'}[g.type]||'';const text=normalize([g.title,g.description,g.type,g.variant,theme,type,g.adapted?'educacao especial adaptado ee':'',g.term+' bimestre'].join(' '));return terms.every(t=>text.includes(t));});}
function showTopics(list,searching){const topics=el('div','','topics'),groups=new Map();for(const g of list){const key=g.term+'|'+g.title;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(g);}for(const entries of groups.values()){const g=entries[0],topic=el('section','','topic'),head=el('div','','topic-head');if(g.image){const img=el('img');img.src=g.image;img.alt='';head.append(img);}const copy=el('div');copy.append(el('h2',g.title),el('p',(g.description||'')+(searching?' · '+g.term+'º bimestre':'')));head.append(copy);topic.append(head);const activities=el('div','','activities');for(const item of entries){const mode=modes[item.type]||{label:item.type,icon:'sound'},cell=el('div','','activity'),a=link('',item.file,'launch'),text=el('span','','copy');text.append(el('b',mode.label+(item.variant?' · '+item.variant:'')),el('small',item.type+(item.adapted?' · Versão adaptada':'')));a.append(icon(mode.icon),text,el('span','→','go'));remember(a,item.year,item.term);cell.append(a);activities.append(cell);}topic.append(activities);topics.append(topic);}main.append(topics);}
function render(focus=false){const p=new URLSearchParams(location.hash.slice(1));let t=Number(p.get('bimestre'));if(!Number.isInteger(t)||t<1||t>4)t=0;const query=searchInput.value.trim(),searching=Boolean(normalize(query));clearSearch.hidden=!query;document.body.classList.toggle('home',false);main.replaceChildren();crumbs.replaceChildren();const home=link('⌂ Início','https://juninhoh72-sketch.github.io/english_games/');home.setAttribute('aria-label','Início — escolher outra série');crumbs.append(home,el('span','›','separator'));if(t)crumbs.append(link('1º ano · Bimestres','#'),el('span','›','separator'),el('span',t+'º bimestre','current-page'));else crumbs.append(el('span','1º ano · Bimestres','current-page'));crumbs.lastChild.setAttribute('aria-current','page');const heading=el('div','','heading');heading.append(el('h1',searching?'Resultados da busca':t?'1º ano · '+t+'º bimestre':'1º ano'),el('p',searching?'Jogos de todos os bimestres do 1º ano':t?'Escolha um tema e uma brincadeira':'Escolha o bimestre'));main.append(heading);document.title=(searching?'Buscar jogos':t?'1º ano · '+t+'º bimestre':'1º ano — Bimestres')+' | English';searchStatus.textContent='';if(!searching&&!t){const grid=el('div','','grades terms');for(let i=1;i<=4;i++)grid.append(tile(i,'BIMESTRE',route(1,i),i));main.append(grid);}else{const list=searching?searchGames(query):games.filter(g=>g.year===1&&g.term===t);if(searching)searchStatus.textContent=list.length+' '+(list.length===1?'jogo encontrado':'jogos encontrados');if(list.length)showTopics(list,searching);else{const box=el('section','','empty');box.append(el('h2',searching?'Nenhum jogo encontrado':'Novos jogos em breve!'),el('p',searching?'Tente outro tema ou tipo de jogo.':'Estamos preparando as atividades deste bimestre.'));if(!searching)box.append(link('← Escolher outro bimestre','#','back'));main.append(box);}}if(focus){main.focus({preventScroll:true});window.scrollTo(0,0);}}
searchInput.addEventListener('input',()=>render());clearSearch.addEventListener('click',()=>{searchInput.value='';render();searchInput.focus();});searchInput.addEventListener('keydown',e=>{if(e.key==='Escape'){searchInput.value='';render();}});document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();render(true);});window.addEventListener('hashchange',()=>{searchInput.value='';render(true);});render();
