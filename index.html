.crumbs a:hover{background:#3064a5;transform:translateY(-2px);}

.crumbs .separator{color:#96b5e5;font-size:24px;}

function el(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e;}

function searchGames(query){const terms=normalize(query).split(' ').filter(Boolean);return games.filter(g=>{const theme={"FOOD!":'comida comidas alimento alimentos bebida bebidas',"FREE TIME ACTIVITIES":'lazer tempo livre atividades',"SHAPES":'forma formas geometria geometricas'}[g.title]||'';const type={'Matching Cards':'pares pareamento memoria','Listen and Choose':'ouvir ouca escutar escolha escolher audio','Word Unscramble':'organizar organize montar letras palavras embaralhadas'}[g.type]||'';const text=normalize([g.title,g.description,g.type,g.variant,theme,type,g.adapted?'educacao especial adaptado ee':'',g.term+' bimestre'].join(' '));return terms.every(t=>text.includes(t));});}
